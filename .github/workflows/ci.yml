name: CI

on:
  push:
  pull_request:

# The containers run as root, which xmake refuses by default; custom tasks without options reject the --root flag.
env:
  XMAKE_ROOT: y

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest  # rolling toolchain: clang 23, mold, Qt 6.12
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git clang lld mold xmake pkgconf unzip \
            qt6-base qt6-declarative qt6-svg qt6-shadertools qt6-tools qt6-translations \
            qt6-multimedia tomlplusplus vulkan-headers vulkan-icd-loader mesa xorg-server-xvfb fontconfig noto-fonts \
            curl libarchive libproxy libsecret openssl sqlite simdjson taglib xxhash ffmpeg
      - uses: actions/checkout@v4
      - name: Configure
        run: xmake f -y -m ${{ matrix.mode }} --qt=/usr/lib/qt6 --werror=y --march=x86-64-v2
      - name: Build
        run: xmake build -y -a
      - name: Unit tests
        run: xmake run noctara-tests
      - name: Smoke test (software and llvmpipe GPU, both themes and languages)
        run: xmake smoke
      - name: Format, i18n and docs sync
        if: matrix.mode == 'debug'
        run: |
          xmake format --check
          xmake i18n-check
          xmake docs-config --check
      - name: clang-tidy
        if: matrix.mode == 'debug'
        run: xmake lint

  tsan:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # tools/tsan.supp matches Qt's and GLib's internal function names, which only their debug symbols provide.
      DEBUGINFOD_URLS: https://debuginfod.archlinux.org
    steps:
      - run: |
          pacman -Syu --noconfirm --needed git clang llvm mold xmake pkgconf \
            qt6-base qt6-declarative qt6-svg qt6-shadertools qt6-tools qt6-multimedia tomlplusplus vulkan-headers \
            curl libarchive libproxy libsecret openssl sqlite simdjson taglib xxhash ffmpeg
      - uses: actions/checkout@v4
      - run: xmake f -y -m tsan --qt=/usr/lib/qt6 && xmake build -y noctara-tests
      - run: xmake test-tsan
